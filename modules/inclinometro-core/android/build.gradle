plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.arklay.inclinometro.core'
version = '0.1.0'

android {
  namespace "dev.arklay.inclinometro.core"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Misma versión que usa React Native: ComponentActivity (ciclo de vida y mini ventana)
  implementation "androidx.appcompat:appcompat:1.7.0"
  // ReactHost: mantener React Native activo en la mini ventana
  implementation "com.facebook.react:react-android"
}
