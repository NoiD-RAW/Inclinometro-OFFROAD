name: Comprobar y compilar APK
# En cada push: comprueba el código (tipos y lint). En main, o a mano, también compila un APK de prueba
# (versión final firmada con la clave de depuración, con todo dentro: no necesita el servidor de desarrollo).
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04            # ya trae el SDK de Android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar el código
        run: npm run check && npm run store:check
      - uses: actions/setup-java@v5
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          INCLINOMETRO_PREVIEW_BUILD: '1'
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          name: InclinometroOffroad-apk
          path: android/app/build/outputs/apk/release/app-release.apk
