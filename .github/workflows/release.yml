name: Publicar release
# Al subir una etiqueta v* (por ejemplo v2.0.1) compila el APK y publica la release con él.
# Con guion en la etiqueta (v2.1.0-beta.1) se publica como versión preliminar.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04            # ya trae el SDK de Android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: SDK de Android (plataforma 34)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Preparar la clave de firma (si está configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "InclinometroOffroad-$GITHUB_REF_NAME.apk"
          else
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "InclinometroOffroad-$GITHUB_REF_NAME.apk"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: Inclinómetro OFFROAD ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: InclinometroOffroad-*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
