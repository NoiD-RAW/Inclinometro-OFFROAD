name: Publicar release
# Al subir una etiqueta v* (por ejemplo v2.2.0) compila el APK de Android y publica la release con él.
# Con guion en la etiqueta (v2.2.0-beta.1) se publica como versión preliminar.
# La versión de iOS se compila y se sube al App Store desde Xcode (ver README).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04            # ya trae el SDK de Android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Comprobar código y material de las tiendas
        run: npm run check && npm run store:check
      - name: Preparar la clave de firma de producción
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Falta el secreto de firma $variable. No se publica con una clave de depuración."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Compilar APK y AAB firmados para Google Play
        env:
          INCLINOMETRO_PREVIEW_BUILD: '0'
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "../InclinometroOffroad-$GITHUB_REF_NAME.aab"
          cp app/build/outputs/apk/release/app-release.apk "../InclinometroOffroad-$GITHUB_REF_NAME.apk"
      - uses: softprops/action-gh-release@v2
        with:
          name: Inclinómetro OFFROAD ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: InclinometroOffroad-*.*
          prerelease: ${{ contains(github.ref_name, '-') }}
