name: Publicar release
# Al subir una etiqueta v* (por ejemplo v2.2.0) compila el APK de Android y publica la release con él.
# Con guion en la etiqueta (v2.2.0-beta.1) se publica como versión preliminar.
# La versión de iOS se compila y se sube al App Store desde Xcode (ver README).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04            # ya trae el SDK de Android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar la clave de firma (si está configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK (y AAB para Google Play si hay clave)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease bundleRelease
            cp app/build/outputs/bundle/release/app-release.aab "../InclinometroOffroad-$GITHUB_REF_NAME.aab"   # para Google Play
          else
            ./gradlew assembleRelease                                                                         # firmado con la clave de depuración
          fi
          cp app/build/outputs/apk/release/app-release.apk "../InclinometroOffroad-$GITHUB_REF_NAME.apk"
      - uses: softprops/action-gh-release@v2
        with:
          name: Inclinómetro OFFROAD ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: InclinometroOffroad-*.*
          prerelease: ${{ contains(github.ref_name, '-') }}
